name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Get version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF/refs\/tags\//}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "RELEASE_NAME=Kerbrute $VERSION" >> $GITHUB_OUTPUT
    
    - name: Build binaries
      run: |
        mkdir -p dist
        
        # Build for multiple platforms
        GOOS=linux GOARCH=amd64 go build -ldflags="-X main.version=${{ steps.get_version.outputs.VERSION }}" -o dist/kerbrute_linux_amd64 .
        GOOS=linux GOARCH=386 go build -ldflags="-X main.version=${{ steps.get_version.outputs.VERSION }}" -o dist/kerbrute_linux_386 .
        
        GOOS=windows GOARCH=amd64 go build -ldflags="-X main.version=${{ steps.get_version.outputs.VERSION }}" -o dist/kerbrute_windows_amd64.exe .
        GOOS=windows GOARCH=386 go build -ldflags="-X main.version=${{ steps.get_version.outputs.VERSION }}" -o dist/kerbrute_windows_386.exe .
        
        GOOS=darwin GOARCH=amd64 go build -ldflags="-X main.version=${{ steps.get_version.outputs.VERSION }}" -o dist/kerbrute_darwin_amd64 .
        GOOS=darwin GOARCH=arm64 go build -ldflags="-X main.version=${{ steps.get_version.outputs.VERSION }}" -o dist/kerbrute_darwin_arm64 .
        
        # Make binaries executable
        chmod +x dist/kerbrute_*
    
    - name: Calculate checksums
      run: |
        cd dist
        sha256sum * > checksums.txt
        cd ..
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: ${{ steps.get_version.outputs.RELEASE_NAME }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          dist/kerbrute_linux_amd64
          dist/kerbrute_linux_386
          dist/kerbrute_windows_amd64.exe
          dist/kerbrute_windows_386.exe
          dist/kerbrute_darwin_amd64
          dist/kerbrute_darwin_arm64
          dist/checksums.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
